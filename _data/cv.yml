projects:
  - name:
      en: "A.ing Discord Bot"
      ko: "A.ing Discord 학습 지원 봇"
    category:
      en: "Serverless learning automation"
      ko: "학습 콘텐츠 및 서비스 설계"
    date: "2026-09-13"
    description:
      en: "Designed separate channels for junior members learning Deep Learning and senior members exploring research interests, with 36 foundational lessons and paper summaries. To address quotations that did not match the source, changed the pipeline to select supporting sentences from the original text rather than generate quotations."
      ko: "주니어의 Deep Learning 기초 학습과 시니어의 연구 탐색을 돕기 위해 채널을 나누고, 36편의 기초 자료와 논문 요약 기능을 만들었습니다. 요약의 인용이 원문과 맞지 않는 문제에 대응해, 인용문을 생성하는 대신 원문 문장 중에서 근거를 선택하도록 수정했습니다."
    page_url:
      en: "/portfolio/discord-bot/"
      ko: "/ko/portfolio/discord-bot/"
    repository_url: "https://github.com/aing-gachon/A.ing-Discord-Bot"
  - name:
      en: "LG Aimers 9th: Pitch Control Success Prediction"
      ko: "LG Aimers 9기 투구 제구 성공 확률 예측"
    category:
      en: "Sports analytics & probabilistic modeling"
      ko: "스포츠 데이터 분석 및 확률 예측"
    date: "2026-08-05"
    description:
      en: "Led the team, managing schedules, Notion documents, meetings, and code reviews. With teammates, examined baseball game context and player histories to understand the domain and guide data Preprocessing and Feature Engineering. Compared tree-based and deep-learning models individually, then explored Ensembles that combined their predictions and adjusted weights by player history. Finished 63rd."
      ko: "팀장으로 일정과 Notion 문서를 관리하고 회의와 코드 검토를 맡았습니다. 팀원들과 야구 경기 상황과 선수 이력을 살펴 도메인 특성을 파악하고, 이를 바탕으로 데이터 Preprocessing과 Feature Engineering을 진행했습니다. Tree-based 모델과 Deep Learning 모델을 각각 실험·비교한 뒤, 예측 결과를 결합하고 선수 이력에 따라 비중을 조정하는 Ensemble을 실험했습니다. 대회에서 63위를 기록했습니다."
    page_url:
      en: "/portfolio/lg-aimers-9th/"
      ko: "/ko/portfolio/lg-aimers-9th/"
    repository_url: "https://github.com/ZEO1122/LG_Aimers_9th"
    notion_url: "https://valiant-crowd-006.notion.site/LG-Aimers-9th-3b2b6928b66c81dd95f7e2b9dcde038c?pvs=74"
    notion_label:
      en: "Project Notion"
      ko: "프로젝트 Notion"
  - name:
      en: "LG Aimers 8th Model Compression"
      ko: "LG Aimers 8기 모델 경량화"
    category:
      en: "LLM model compression"
      ko: "LLM 모델 경량화"
    date: "2025-12-01"
    description:
      en: "Participated in EXAONE-4.0-1.2B compression, using conversational preprocessing and QLoRA Fine-Tuning to address training resource constraints. Built an optional GPTQ W8A8 path after Adapter merging and connected it to submission packaging. The team finished 40th out of over 600 teams."
      ko: "EXAONE-4.0-1.2B 경량화 프로젝트에 참여해 대화 데이터 전처리와 QLoRA Fine-Tuning으로 학습 자원 제약에 대응했습니다. Adapter 병합 후 선택적으로 GPTQ W8A8을 적용하고 제출물을 생성하도록 구성했으며, 팀은 600여 팀 중 40위를 기록했습니다."
    page_url:
      en: "/portfolio/lg-aimers/"
      ko: "/ko/portfolio/lg-aimers/"
    repository_url: "https://github.com/ZEO1122/LG_Aimers_8th"
  - name:
      en: "Transformer Architecture Study"
      ko: "Transformer 스터디 자료 제작"
    category:
      en: "Study curriculum & implementation"
      ko: "학습 과정 설계 및 구현"
    date: "2026-02-13"
    description:
      en: "Led the production of Transformer study materials spanning prerequisites, paper reading, implementation, and experiments. Prepared NLP and pre-Transformer background materials, a paper guide, cheat sheets, and concept quizzes, followed by PyTorch cookbook-guided implementation exercises. Designed a subsequent translation-model competition where participants could deepen their understanding of the model through hands-on hyperparameter tuning."
      ko: "Transformer를 기초 개념부터 직접 구현과 실험까지 익힐 수 있도록 스터디 자료 제작을 총괄했습니다. NLP 기초와 Transformer 이전 아키텍처를 다루는 사전 자료, 논문 가이드·치트시트·개념 퀴즈, PyTorch 쿡북을 활용한 빈칸 구현 실습을 학습 순서에 맞춰 구성했습니다. 이후 번역 모델 리그전에서 직접 Hyperparameter Tuning을 해보며 모델에 대한 이해를 높일 수 있도록 설계했습니다."
    page_url:
      en: "/portfolio/transformer-study/"
      ko: "/ko/portfolio/transformer-study/"
    repository_url: "https://github.com/aing-gachon/26-Spring-Transformer-Study"

