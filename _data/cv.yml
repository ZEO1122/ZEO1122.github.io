projects:
  - name:
      en: "A.ing Discord Bot"
      ko: "A.ing Discord 학습 지원 봇"
    category:
      en: "Serverless learning automation"
      ko: "학습 콘텐츠 및 서비스 설계"
    date: "2026-09-13"
    description:
      en: "Designed separate channels for junior members learning Deep Learning and senior members exploring research interests. Prepared 36 foundational lessons and a paper-summary pipeline that selects quotations from source sentences. Learned to match content depth and verification methods to each audience."
      ko: "주니어의 Deep Learning 기초 학습과 시니어의 연구 탐색을 돕기 위해 채널을 나누고, 36편의 기초 자료와 논문 요약 기능을 만들었습니다. 요약의 인용이 원문과 맞지 않는 문제는 원문 문장 중에서 근거를 선택하도록 바꿔 대응했습니다. 학습 대상에 따라 설명의 깊이와 검증 방법도 달라져야 한다는 점을 배웠습니다."
    page_url:
      en: "/portfolio/discord-bot/"
      ko: "/ko/portfolio/discord-bot/"
    repository_url: "https://github.com/aing-gachon/A.ing-Discord-Bot"
  - name:
      en: "LG Aimers 9th: Pitch Control Success Prediction"
      ko: "LG Aimers 9기 투구 제구 성공 확률 예측"
    category:
      en: "Sports analytics & probabilistic modeling"
      ko: "스포츠 데이터 분석 및 확률 예측"
    date: "2026-08-05"
    description:
      en: "Led the team, managing schedules, Notion documents, meetings, and code reviews. When internal Validation gains did not carry over to submissions, the team examined results by season and player history and adjusted Ensemble conditions. Finished 63rd and learned to assess where improvements hold, not just the overall score."
      ko: "팀장으로 일정과 Notion 문서를 관리하고 회의와 코드 검토를 맡았습니다. 내부 Validation의 개선이 제출 결과로 이어지지 않아 팀원들과 시기·선수 이력별 결과를 검토하고 Ensemble 조건을 조정했습니다. 대회에서 63위를 기록했으며, 점수뿐 아니라 어떤 조건에서 효과가 유지되는지 확인하는 법을 배웠습니다."
    page_url:
      en: "/portfolio/lg-aimers-9th/"
      ko: "/ko/portfolio/lg-aimers-9th/"
    repository_url: "https://github.com/ZEO1122/LG_Aimers_9th"
    notion_url: "https://valiant-crowd-006.notion.site/LG-Aimers-9th-3b2b6928b66c81dd95f7e2b9dcde038c?pvs=74"
    notion_label:
      en: "Project Notion"
      ko: "프로젝트 Notion"
  - name:
      en: "LG Aimers 8th Model Compression"
      ko: "LG Aimers 8기 모델 경량화"
    category:
      en: "LLM model compression"
      ko: "LLM 모델 경량화"
    date: "2025-12-01"
    description:
      en: "Led an EXAONE-4.0-1.2B compression team, comparing QLoRA fine-tuning and an optional GPTQ W8A8 quantization path under fixed submission constraints. Finished 40th out of over 600 teams."
      ko: "EXAONE-4.0-1.2B 경량화 팀을 이끌며 QLoRA Fine-Tuning과 선택적 GPTQ W8A8 Quantization을 실험했습니다. 정해진 제출 환경에서 성능과 연산 비용을 비교했으며, 600여 팀 중 40위를 기록했습니다."
    page_url:
      en: "/portfolio/lg-aimers/"
      ko: "/ko/portfolio/lg-aimers/"
    repository_url: "https://github.com/ZEO1122/LG_Aimers_8th"
  - name:
      en: "Transformer Architecture Study"
      ko: "Transformer 스터디 자료 제작"
    category:
      en: "Study curriculum & implementation"
      ko: "학습 과정 설계 및 구현"
    date: "2026-02-13"
    description:
      en: "Led the production of materials connecting Transformer concepts with code. Linked the paper guide, PyTorch cookbook, and 36 implementation exercises, with checks to help learners locate mistakes. Explaining Tensor dimensions and Masking also sharpened my own understanding."
      ko: "Transformer의 개념과 코드를 연결하는 스터디 자료 제작을 총괄했습니다. 논문 가이드와 PyTorch 쿡북, 36개 빈칸 실습을 연결하고 단계별 검사를 넣어 구현 중 막힌 부분을 찾도록 했습니다. Tensor의 차원과 Masking을 설명하며 저도 기본 개념을 더 꼼꼼히 확인했습니다."
    page_url:
      en: "/portfolio/transformer-study/"
      ko: "/ko/portfolio/transformer-study/"
    repository_url: "https://github.com/aing-gachon/26-Spring-Transformer-Study"

